function lib(){const q=D.q.trim(),b=D.big,v=D.val;return MAT.filter(m=>{const acc=['金屬隔珠','吊墜'].includes(m.m);if(b==='單珠'&&acc)return 0;if(b==='配飾'&&!acc)return 0;
if(v){if(b==='單珠'||b==='配飾'){if(m.m!==v)return 0}else if(b==='按顏色'){if(mc(m)!==v)return 0}else if(b==='按數字'){if(!mn(m).includes(v))return 0}else if(b==='按五行'){if(me(m)!==v)return 0}else if(b==='按脈輪'){if(mh(m)!==v)return 0}else if(!mn(m).some(n=>TN[n]===v))return 0}

V.preview=()=>`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="chip" onclick="go('diy')">← 回 DIY</button><span class="row"><button class="chip ${D.num?'on':''}" onclick="D.num=!D.num;render()">顯示編號</button><button class="btn" onclick="orderNow()">下訂製作</button></span></div>
<div class="pv"><div class="card pvt"><svg id="pcv" viewBox="0 0 320 320"></svg></div><div class="card pvb"><div id="strip"></div><div id="tr"></div><div class="row skins"><span class="note">膚色</span>${['#f6dcc6','#f1cfb4','#d9a77c','#a9714b'].map(c=>`<button style="background:${c}" onclick="D.skin='${c}';trDraw()"></button>`).join('')}<span class="note">手型</span>${[['小',.85],['中',1],['大',1.15]].map(h=>`<button class="chip sm" onclick="D.hs=${h[1]};trDraw()">${h[0]}</button>`).join('')}<span class="note">旋轉</span><input type="range" min="0" max="360" value="${D.rot}" style="flex:1;min-width:120px" oninput="D.rot=+this.value;trDraw()"></div></div></div>`;
function pvDraw(){$('#pcv').innerHTML=cvSvg(true);stripDraw();trDraw()}
function orderNow(){if(!D.b.length){toast('請先設計手串');return}add({id:'d'+Date.now(),n:D.name||'我的專屬手鍊',beads:[],price:tot(),size:D.size});checkout()}
function ringImg(b){const n=b.length,R=66,r=Math.min(16,Math.PI*R/n*.92);return `<svg viewBox="0 0 340 210"><circle cx="170" cy="105" r="${R}" fill="none" stroke="#b9a58a" stroke-width="1.5" opacity=".6"/>${b.map((id,i)=>{const t=i/n*2*Math.PI,x=170+R*Math.sin(t),y=105-R*Math.cos(t);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${S[id].c}" stroke="rgba(0,0,0,.25)"/><circle cx="${(x-r*.3).toFixed(1)}" cy="${(y-r*.3).toFixed(1)}" r="${(r*.28).toFixed(1)}" fill="#fff" opacity=".55"/>`}).join('')}</svg>`}
function dform(id){return `<div class="chips">${['西元','民國','農曆'].map(c=>`<button class="chip ${T.cal===c?'on':''}" onclick="sv('${id}');T.cal='${c}';render()">${c}</button>`).join('')}</div><div class="row"><input id="${id}y" type="number" placeholder="${T.cal==='民國'?'民國年':'出生年'}" value="${T.y}" style="width:110px"><input id="${id}m" type="number" placeholder="月" value="${T.m}" style="width:80px"><input id="${id}d" type="number" placeholder="日" value="${T.d}" style="width:80px"></div>${T.cal==='農曆'?'<p class="note">Demo：農曆以輸入的數字直接計算，未做農曆換算。</p>':''}<br>`}
function sv(id){if($('#'+id+'y')){T.y=$('#'+id+'y').value;T.m=$('#'+id+'m').value;T.d=$('#'+id+'d').value}}
function rd(id){sv(id);let y=+T.y,m=+T.m,d=+T.d;if(!y||m<1||m>12||d<1||d>31){toast('請完整輸入生日');return null}if(T.cal==='民國')y+=1911;return[y,m,d]}
const stags=r=>r.map(i=>`<span class="tag">${S[i].n}・${S[i].k}</span>`).join(''),toBtn=r=>`<button class="btn" onclick="toDIY([${r.map(i=>`'${i}'`).join(',')}])">用這些礦石到 DIY 創作 →</button>`;
const tcard=(n,t,l)=>`<div class="tcard"><div class="tn">${n}</div>${art(+n)}<div class="tt">${t}</div><i>${l}</i></div>`;
const LS=[[4,9,2],[3,5,7],[8,1,6]];
function calcN(){const b=rd('a');if(!b)return;const [y,m,d]=b,dg=''+y+m+d,cnt={};for(let i=1;i<10;i++)cnt[i]=0;[...dg].forEach(c=>{if(+c)cnt[c]++});T.rn={y,main:red(ds(dg)),inn:red(ds(d)),gift:red(ds(''+m+d)),cnt};render()}
function numRes(r){const miss=[1,2,3,4,5,6,7,8,9].filter(n=>!r.cnt[n]),rec=[...new Set([...N[r.main][2],N[r.gift][2][0],...miss.slice(0,2).map(n=>N[n][2][0])])].slice(0,4);
return `<div class="card" style="margin-top:16px"><div class="lo">${LS.flat().map(n=>{const c=r.cnt[n];return `<div class="lc ${c?'':'miss'}"><b>${c?String(n).repeat(c):n}</b><span>${(r.main===n?'<i>★</i>':'')+(r.inn===n?'<i>◆</i>':'')+(r.gift===n?'<i>✦</i>':'')+(c?'':'<i>○</i>')}</span></div>`}).join('')}</div><p class="note" style="text-align:center">★ 主命數　◆ 先天數　✦ 天賦數　○ 缺數（西元 ${r.y} 年）</p>
<h2>解析</h2><p><b>主命數 ${r.main}・${N[r.main][0]}</b>：${N[r.main][1]}</p><p><b>先天數 ${r.inn}</b>：天生的底色偏向「${N[r.inn][0]}」。</p><p><b>天賦數 ${r.gift}</b>：可發展的才能偏向「${N[r.gift][0]}」。</p><p><b>缺數 ${miss.join('、')||'無'}</b>：${miss.length?'缺少的數字是可以多加練習的能量，搭配對應礦石能協助補足。':'九個數字都具備，能量相對均衡。'}</p><p>建議礦石：${stags(rec)}</p>${toBtn(rec)}</div>`}
const QS=[['清晨醒來，你最想先做什麼？','靜靜待一會兒','傳訊息給重要的人','立刻出門動一動'],['理想的假日是？','圖書館或森林','與朋友聚餐','嘗試新活動'],['遇到困難時你傾向？','先沉澱思考','找人傾訴','直接行動解決'],['最吸引你的顏色？','深藍或紫','粉或柔橘','金黃或橘紅'],['希望今年多一點？','洞察與平靜','愛與連結','自信與豐盛']];
const PSY={A:{c:'女祭司',n:2,l:'靜下來，答案早已在你心裡。',t:'你現在需要沉澱與直覺的力量。藍紫色系礦石能幫助你安定情緒、聽見內在的聲音。',s:['lapis','amethyst','moon']},B:{c:'皇后',n:3,l:'先擁抱自己，愛會自然流動。',t:'你現在需要溫柔與連結。粉橘色系礦石能滋養情感，也讓關係更柔軟。',s:['rose','moon','aventurine']},C:{c:'太陽',n:19,l:'你本身就是光，放心前行。',t:'你現在需要行動與自信。金橙色系礦石能點燃動力，帶來豐盛的感受。',s:['citrine','carnelian','rutile']}};
function psyGo(){if(T.ans.filter(Boolean).length<QS.length){toast('請回答所有題目');return}const c={A:0,B:0,C:0};T.ans.forEach(a=>c[a]++);T.pr=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];render()}
function tarGo(){const b=rd('t');if(!b)return;let s=ds(b[1])+ds(b[2])+ds(new Date().getFullYear());while(s>22)s=ds(s);T.tr=s;render()}
const tab3=()=>`<div class="chips">${[['num','生命靈數'],['psy','心理測驗'],['tar','流年塔羅']].map(t=>`<button class="chip ${T.tab===t[0]?'on':''}" onclick="T.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
V.test=()=>{let h='';if(T.tab==='num')h=`<div class="card intro"><h2>🔢 生命靈數</h2><p>源自畢達哥拉斯的數字學，將生日化為 1–9 的數字，看見性格傾向、天賦與缺少的能量。</p>${dform('a')}<button class="btn" onclick="calcN()">送出計算</button></div>${T.rn?numRes(T.rn):''}`;
else if(T.tab==='psy'){const p=T.pr?PSY[T.pr]:null;h=`<div class="card intro"><h2>🌙 心理測驗</h2><p>五個小問題，每題三個選項，憑直覺選擇，找出你現在最需要的礦石能量。</p>${QS.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b><div class="chips">${['A','B','C'].map((k,j)=>`<button class="chip ${T.ans[i]===k?'on':''}" onclick="T.ans[${i}]='${k}';render()">${q[j+1]}</button>`).join('')}</div></div>`).join('')}<button class="btn" onclick="psyGo()">看結果</button></div>${p?`<div class="card" style="margin-top:16px">${tcard(p.n,p.c,p.l)}<h2>解析</h2><p>${p.t}</p><p>建議礦石：${stags(p.s)}</p>${toBtn(p.s)}</div>`:''}`}
else{const n=T.tr,c=n===22?0:n,r=n?N[(n-1)%9+1][2]:[];h=`<div class="card intro"><h2>🃏 流年塔羅</h2><p>以出生月日加上今年的數字，得出代表這一年的塔羅牌，作為這一年的能量指引。</p>${dform('t')}<button class="btn" onclick="tarGo()">抽出流年牌</button></div>${n?`<div class="card" style="margin-top:16px">${tcard(c,TN[c],TK[c])}<h2>解析</h2><p>今年的關鍵字是「${TK[c]}」。把握與${TN[c]}相關的課題，搭配礦石穩定能量。</p><p>建議礦石：${stags(r)}</p>${toBtn(r)}</div>`:''}`}
return `<h1>測驗區</h1>${tab3()}${h}`};
const CK=[['大地之星','#6b4f3a','位於雙腳下方，連結大地、安定身心。','黑曜石、虎眼石'],['海底輪','#c0392b','尾椎，掌管生存與安全感。','紅瑪瑙、黑曜石'],['臍輪／生殖輪','#e98a4b','下腹，掌管情感與創造力。','紅瑪瑙、虎眼石'],['胃輪／太陽神經叢輪','#f2c94c','上腹，掌管自信與行動力。','黃水晶、鈦晶'],['心輪','#5fae7e','胸口，掌管愛與關係。','綠幽靈、東菱石、粉晶'],['喉輪','#4a78c2','喉嚨，掌管表達與溝通。','青金石'],['眉心輪','#3b3f9c','眉心，掌管直覺與洞察。','青金石、月光石'],['頂輪','#9b7fd1','頭頂，掌管靈性與智慧。','紫水晶、白水晶'],['靈魂之星','#e8e1f5','頭頂上方，連結高我與宇宙。','白水晶、鈦晶']];
const CARE=['避免長時間曝曬、高溫與潮濕','運動、洗澡、游泳、睡覺時取下','避免接觸香水、化妝品與清潔劑','與硬物分開，放在軟布袋中收納','彈力線約 1–2 年建議更換'],PUR=[['月光淨化','滿月夜擺放窗邊 4–6 小時，適合多數礦石。'],['煙燻淨化','以白鼠尾草或聖木的煙繞過手串。'],['白水晶／消磁石','放在白水晶簇或消磁石上 6–12 小時。'],['音波淨化','以頌缽或音叉震動，快速且溫和。'],['注意','珍珠、木珠等易受損素材避免泡水與日曬。']];
V.know=()=>{const t=st.kt||'脈輪';return `<h1>知識區</h1><div class="chips">${['脈輪','保養','淨化'].map(x=>`<button class="chip ${t===x?'on':''}" onclick="st.kt='${x}';render()">${x}</button>`).join('')}</div><div class="card">${t==='脈輪'?CK.map(c=>`<details><summary><i class="cd" style="background:${c[1]}"></i>${c[0]}</summary><p>${c[2]}</p><p>對應礦石：${c[3]}</p></details>`).join(''):(t==='保養'?'<h2>如何保養、保存水晶</h2>'+CARE.map(x=>`<details open><summary>${x}</summary></details>`).join(''):'<h2>如何淨化水晶</h2>'+PUR.map(x=>`<details open><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join(''))}</div>`};
V.svc=()=>`<h1>服務區</h1><div class="two"><div class="card"><h2>📮 聯絡我們</h2><p>客服信箱：hello@example.com（範例）<br>服務時間：週一至週五 10:00–18:00</p></div><div class="card"><h2>🧵 水晶換線處理</h2><div class="row"><select id="wl" style="width:auto"><option>彈力線</option><option>鋼絲線</option><option>絲線</option></select><input id="ws" type="number" placeholder="手圍 cm" style="width:110px"><button class="btn" onclick="toast('已送出換線申請（Demo）')">送出申請</button></div><p class="note">換線約 3–5 個工作天。</p></div></div><br><div class="card"><h2>常見問題</h2>${QA.map(k=>`<details><summary>${k[0]}</summary><p>${k[1]}</p></details>`).join('')}</div><br><div class="card"><h2>我的訂單</h2>${st.orders.map(o=>`<div class="line"><span>${o.no}　${o.items} 件商品</span><b>NT$ ${o.total}　<span class="tag">製作中</span></b></div>`).join('')||'<p class="sub">尚無訂單，完成結帳後會顯示在這裡。</p>'}</div>`;
V.soc=()=>`<h1>社群</h1><p class="sub">追蹤我們，獲得新品與礦石知識。</p><div class="grid">${[['📘','Facebook'],['💬','LINE'],['📷','Instagram']].map(s=>`<div class="card soc" onclick="toast('${s[1]} 連結待上線後填入（Demo）')"><span>${s[0]}</span><h2>${s[1]}</h2></div>`).join('')}</div>`;
V.home=()=>{const se=[5,4,8].map(id=>P.find(p=>p.id===id)),hot=[7,3,6,101,201,301].map(id=>P.find(p=>p.id===id));return `<section class="hero2"><div class="biglogo">礦語</div><p>藉由創作，與自己深度對話</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('diy')">開始 DIY 創作</button><button class="btn ghost" onclick="go('test')">測測我的能量</button></div></section><div class="entry">${[['test','能量測驗',2],['diy','DIY 創作',5],['know','知識補給',3]].map(e=>`<div class="ecard" onclick="go('${e[0]}')">${art(e[2])}<b>${e[1]}</b></div>`).join('')}</div><section class="season"><div class="row" style="justify-content:space-between"><h2>2026 冬季當季商品</h2><button class="chip" onclick="go('shop')">看全部商品</button></div><div class="srow">${se.map(p=>`<div class="sitem" onclick="detail(${p.id})">${img(p)}<b>${p.n}</b><small>${p.sc}</small></div>`).join('')}</div></section><h2 style="margin-top:26px">熱門商品</h2><div class="grid">${hot.map(card).join('')}</div>`};
function render(){const tabs=[['home','首頁'],['shop','商品列表'],['diy','DIY 設計'],['test','測驗區'],['know','知識區'],['svc','服務區'],['soc','社群']];$('#nav').innerHTML=tabs.map(t=>`<button class="${(st.view==='preview'?'diy':st.view)===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#cc').textContent=st.cart.reduce((a,c)=>a+c.qty,0);$('#app').innerHTML=V[st.view]();if(st.view==='diy'){libDraw();diyDraw()}else if(st.view==='preview')pvDraw();}
document.body.insertAdjacentHTML('afterbegin','<svg width="0" height="0" style="position:absolute"><filter id="wc" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16"/><feGaussianBlur stdDeviation="1.4"/></filter></svg>');
const SP={0:'leaf',2:'moon',3:'flower',17:'star',18:'moon',19:'sun'},DEF=['gem','leaf','wave','star','flower'],PAL=[['#8fb0e0','#f4c9c4'],['#b7a6e0','#f2d6a8'],['#9fd0c8','#f4c9c4'],['#f2c086','#a9b9e8']];
function art(c){const m=SP[c]||DEF[c%5],[a,b]=PAL[c%4],g='#c99a4e',ln=`fill="none" stroke="${g}" stroke-width="1.6" stroke-linecap="round"`;
let s=`<ellipse cx="100" cy="92" rx="80" ry="70" fill="${a}" opacity=".55" filter="url(#wc)"/><ellipse cx="124" cy="112" rx="56" ry="48" fill="${b}" opacity=".65" filter="url(#wc)"/>`;
if(m==='moon')s+=`<mask id="mk"><rect width="200" height="190" fill="#fff"/><circle cx="120" cy="86" r="34" fill="#000"/></mask><circle cx="98" cy="95" r="40" fill="#fbe9c0" mask="url(#mk)" stroke="${g}"/>`;
else if(m==='sun')s+=`<circle cx="100" cy="95" r="26" fill="#f6c26b" stroke="${g}"/>`+Array.from({length:12},(_,i)=>{const t=i*Math.PI/6;return `<line x1="${100+36*Math.cos(t)}" y1="${95+36*Math.sin(t)}" x2="${100+52*Math.cos(t)}" y2="${95+52*Math.sin(t)}" ${ln}/>`}).join('');
else if(m==='star')s+=`<polygon points="100,50 110,81 143,81 117,100 127,132 100,113 73,132 83,100 57,81 90,81" fill="#fbe9c0" stroke="${g}" stroke-width="1.6" stroke-linejoin="round"/>`;
else if(m==='flower')s+=Array.from({length:5},(_,i)=>`<ellipse cx="100" cy="68" rx="14" ry="26" fill="${b}" stroke="${g}" transform="rotate(${i*72} 100 95)"/>`).join('')+`<circle cx="100" cy="95" r="9" fill="#f6c26b" stroke="${g}"/>`;
else if(m==='leaf')s+=`<path d="M100 138C58 112 62 70 100 50c38 20 42 62 0 88z" fill="#a9d3b0" stroke="${g}" stroke-width="1.6"/><path d="M100 138V62" ${ln}/>`;
else if(m==='gem')s+=`<polygon points="68,80 100,50 132,80 100,140" fill="#e3ebf2" stroke="${g}" stroke-width="1.6" stroke-linejoin="round"/><path d="M68 80H132M100 50L86 80L100 140L114 80Z" ${ln}/>`;
else s+=[84,104,124].map(y=>`<path d="M48 ${y}q13-15 26 0t26 0t26 0t26 0" ${ln}/>`).join('');
s+=[[40,50],[160,62],[150,150],[52,140]].map(p=>`<path d="M${p[0]} ${p[1]-5}l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="${g}"/>`).join('');
return `<svg viewBox="0 0 200 190" style="width:100%;display:block">${s}</svg>`}

render();
</script>
